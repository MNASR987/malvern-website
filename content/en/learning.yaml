curriculum:
  title: "Our Curriculum"
  text: |
    Malvern International School follows an American curriculum, taught through programmes from Savvas and Obelearn. Classes have no more than 25 students, so teachers know each learner's strengths and the things they still find hard. Alongside the American curriculum, every student studies the identity subjects: Arabic, Holy Quran and Islamic Studies, and Social Studies.

