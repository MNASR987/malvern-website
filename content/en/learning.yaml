      text: "Rigorous study across core subjects prepares students for university and their future careers, with guidance on subject choices and next steps. SPRIX continues in Grade 9."

curriculum:
  title: "Our Curriculum"
  text: |
    Malvern International School follows an American curriculum, taught through programmes from Savvas and Obelearn. Classes have no more than 25 students, so teachers know each learner's strengths and the things they still find hard.

    The core subjects are English language arts, mathematics and science. Alongside them, every student studies the identity subjects: Arabic, Holy Quran and Islamic Studies, and Social Studies. Mathematics and programming from Grade 1 to Grade 9 are enriched through our partnership with SPRIX in Japan.

    Lessons are active and practical. Students question, discuss, investigate and apply what they learn, because we believe critical thinking matters more than memorising information.

identity:
  title: "Identity Subjects"
  intro: "Every Malvern learner grows with a strong sense of faith, language and nation."
  items:
    - title: "Arabic"
      text: "Students build strong reading, writing, speaking and listening skills in Arabic, and grow to love the language of the Quran and of their heritage."
    - title: "Holy Quran & Islamic Studies"
      text: "Students learn to recite and memorise the Holy Quran and understand its meanings, guided by Islamic principles of respect, honesty and integrity."
    - title: "Social Studies"
      text: "Students learn about the history, geography and culture of Saudi Arabia, and what it means to be a responsible citizen in a changing world."

languages:
  title: "Languages"
  text: |
    English is the language of instruction for the American curriculum subjects, so students become confident readers, writers and speakers of English.

    Arabic is taught as a core subject to every student, and Holy Quran and Islamic Studies are taught in Arabic. Students leave Malvern able to learn, work and lead in both languages.

stem:
  title: "STEM with SPRIX (Japan)"
  text: "Malvern partners with SPRIX Inc., a Japanese education company, for mathematics and programming in Grades 1 to 9. Learners also sit TOFAS, an external assessment, so that families can see progress measured against an outside benchmark."
  points:
    - "Mathematics — Grades 1 to 9"
    - "Programming — Grades 1 to 9"
    - "TOFAS external assessment"
  more: "Students study mathematics and programming using methods developed in Japanese schools, which build deep understanding, logical thinking and problem-solving."

assessment:
  title: "Our Approach to Assessment"
  text: |
    Teachers check understanding every day in class, through questions, classwork and feedback, so that no student is left behind.

    Each semester has two quiz cycles, followed by a revision week and semester exams. Parents meet teachers at two parent–teacher conferences each year, in October and April, and the dates for every assessment are in the academic calendar.

    In Grades 1 to 9, the TOFAS external assessment from SPRIX shows how students are progressing in mathematics against an outside benchmark.
