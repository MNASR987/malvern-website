# LEARNING PAGE
seo:
  title: "Learning"
  description: "The American curriculum and Learner Journey at Malvern International School, Riyadh: KG, Primary, Middle and High School, identity subjects, languages, and mathematics and programming with SPRIX (Japan)."

hero:
  title: "Learning at Malvern"
  text: "A connected journey from Kindergarten to Grade 12: an American curriculum, classes of no more than 25, and strong Arabic, Islamic and national foundations."

journey:
  title: "The Learner Journey"
  intro: "Four phases, one continuous journey — each building on the last."
  phases:
    - name: "Kindergarten"
      grades: "KG1 – KG3"
      who: "Boys and girls"
      text: "Children learn through play, stories, songs and hands-on discovery. They build early reading, writing and number skills in English and Arabic, learn short surahs and Islamic manners, and grow in confidence, so that they start Grade 1 curious and ready to learn."
    - name: "Primary"
      grades: "Grades 1 – 5"
      who: "Boys and girls"
      text: "Strong foundations in English language arts, mathematics, science and social studies through the American curriculum, with Savvas and Obelearn programmes. Mathematics and programming with SPRIX begin in Grade 1, alongside Arabic, Holy Quran and Islamic Studies."
    - name: "Middle School"
      grades: "Grades 6 – 8"
      who: "Girls Grades 6–8 · Boys Grade 6"
