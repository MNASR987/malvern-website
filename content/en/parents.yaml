# PARENTS PAGE
# The academic calendar itself is in content/en/calendar.yaml
seo:
  title: "Parents"
  description: "Information for parents at Malvern International School, Riyadh: academic calendar 2026–2027, school uniform, key policies and the parent portal."

hero:
  title: "Parents"
  text: "Everything you need for the school year, in one place."

portal:
  title: "Parent Portal"
  text: "Log in to follow your child's learning, reports and school announcements."
  button: "Go to the Parent Portal"
  missing: "[TO CONFIRM: Parent portal link]"

uniform:
  title: "School Uniform"
  text: |
    School uniform is compulsory for all students, every school day. It helps our students feel part of one community, and it keeps the focus on learning.

    **Girls** wear a white polo shirt with the Malvern crest. **Boys** wear a navy polo shirt with the Malvern crest.

    The uniform is available from the school. Full details of the complete uniform and the PE kit are given when you collect it. Please label every item with your child's name.

partnership:
  title: "Working together"
  items:
    - title: "Parent–teacher conferences"
      text: "Two conferences each year — in October and April — to talk with teachers about your child's progress."
    - title: "Quizzes and exams"
      text: "Two quiz cycles in each semester, then a revision week and semester exams. Dates are in the calendar above."
    - title: "Speak to us early"
      text: "Our door is open. If something is worrying you or your child, contact the class teacher or the school office — we would always rather hear a concern early than late."

policies:
  title: "Key Policies"
  intro: "Copies of our school policies are available from the school office on request."
