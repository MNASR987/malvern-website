  title: "Why work with us"
  text: "At Malvern you will teach classes of no more than 25 students, with a modern American curriculum, Savvas and Obelearn resources, and Japanese mathematics and programming through our partnership with SPRIX. We value teachers who care about every child, keep learning themselves and work as a team. As one of the schools of El-Shrouk Pioneer Academy, we offer a supportive community and opportunities to grow."

