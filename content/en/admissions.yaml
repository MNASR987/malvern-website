# ADMISSIONS PAGE
seo:
  title: "Admissions"
  description: "Admissions at Malvern International School, Riyadh: who we admit, the admissions process, required documents, 2026–2027 tuition fees, FAQ, enquiries and school tours."

hero:
  title: "Admissions"
  text: "We look forward to welcoming your family. Here is everything you need to begin."

whoWeAdmit:
  title: "Who We Admit"
  groups:
    - { title: "Girls", text: "KG1 to Grade 12" }
    - { title: "Boys", text: "KG1 to Grade 6" }
  note: "Families of all nationalities are welcome. Age requirements for each grade follow Ministry of Education regulations — our admissions team will confirm the right grade for your child."

process:
  title: "The Admissions Process"
  note: "Six simple steps from your first question to your child's first day."
  steps:
    - { title: "Enquire", text: "Send us an enquiry online, by WhatsApp or by phone." }
    - { title: "Visit", text: "Book a tour of the school and meet our admissions team." }
    - { title: "Apply", text: "Complete the application and submit the required documents." }
    - { title: "Assessment", text: "Your child meets our team for a friendly placement assessment, so we can understand their level and support them from day one." }
    - { title: "Offer", text: "We contact you with the admission decision and the next steps." }
    - { title: "Registration", text: "Confirm the place by completing registration and paying the fees. We will then welcome your child and share everything you need for the first day." }

documents:
  title: "Required Documents"
  note: "Please bring copies of the following. Our admissions team will tell you if anything else is needed for your child's grade."
  items:
    - "Student's birth certificate"
    - "Student's passport and Iqama, or National ID (for Saudi students)"
    - "Parent's or guardian's ID or Iqama"
    - "Latest school report and transfer certificate (from Grade 1 upwards)"
    - "Vaccination record"
    - "Recent passport-size photographs"

fees:
  title: "Tuition Fees 2026–2027"
  intro: "Annual tuition fees in Saudi riyals (SAR), excluding VAT."
  columnStage: "Grade"
  columnFee: "Annual tuition (SAR)"
  # Full annual fees only. Do not add discounted fees here.
  rows:
    - { stage: "KG1", fee: "11,875" }
    - { stage: "KG2 – KG3", fee: "12,500" }
    - { stage: "Grades 1 – 2", fee: "13,750" }
    - { stage: "Grades 3 – 4", fee: "15,000" }
    - { stage: "Grades 5 – 6", fee: "16,250" }
    - { stage: "Grades 7 – 9", fee: "17,500" }
    - { stage: "Grades 10 – 12", fee: "18,000" }
  notes:
    - "All fees exclude VAT."
    - "Boys are admitted from KG1 to Grade 6; girls from KG1 to Grade 12."
    - "For other costs, such as books, uniform or transport, and for payment schedules, please contact our admissions team."

offers:
  title: "Offers & Announcements"
  intro: "Current campaigns and announcements from our admissions team."

faq:
  title: "Frequently Asked Questions"
  items:
    - q: "Which grades do you offer?"
      a: "Girls from KG1 to Grade 12, and boys from KG1 to Grade 6."
    - q: "Are the fees inclusive of VAT?"
      a: "No. The tuition fees shown are annual fees in Saudi riyals, excluding VAT."
    - q: "Which curriculum do you follow?"
      a: "An American curriculum, taught through Savvas and Obelearn programmes, alongside Arabic, Holy Quran and Islamic Studies, and Social Studies."
    - q: "How big are the classes?"
      a: "No more than 25 students in a class."
    - q: "Do you teach Arabic and Islamic Studies?"
      a: "Yes. Arabic, Holy Quran and Islamic Studies, and Social Studies are taught as identity subjects."
    - q: "What is the SPRIX programme?"
      a: "Malvern partners with SPRIX Inc. (Japan) for mathematics and programming in Grades 1 to 9, including the TOFAS external assessment."
    - q: "Is there a school uniform?"
      a: "Yes. Uniform is compulsory for all students and is available from the school."
    - q: "What are the school hours?"
      a: "Sunday to Thursday, 6:30 am to 1:30 pm. Timings are adjusted during Ramadan."
    - q: "Is the school accredited?"
      a: "Malvern International School is a member of Cognia and is working through the Cognia accreditation process."
    - q: "Who runs the school?"
      a: "Malvern International School is one of the schools of El-Shrouk Pioneer Academy."
    - q: "Do you provide school transport?"
      a: "Please contact our admissions team to ask about school transport for your area."
    - q: "When can my child start?"
      a: "The 2026–2027 school year began on 23 August 2026. Contact our admissions team to check availability in your child's grade — we will be happy to help with joining during the year where places allow."

enquire:
  title: "Enquire or Book a Tour"
  text: "Share a few details and our admissions team will contact you."
