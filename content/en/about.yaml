# ABOUT PAGE
seo:
  title: "About Us"
  description: "About Malvern International School, Riyadh, one of the schools of El-Shrouk Pioneer Academy: a word from the Principal, Ms. Sara El-Massry,, vision, mission and values, leadership, partnerships, accreditation status and licensing."

hero:
  title: "About Malvern"
  text: "An international school in Riyadh, for girls from KG to Grade 12 and boys from KG to Grade 6."

welcome:
  title: "A Word from our Principal"
  body: |
    Welcome to Malvern International School.

    When families visit us for the first time, they usually ask the same question: what will my child’s day actually feel like here? I like that question, because the honest answer matters more than any brochure.

    At Malvern, your child learns in a class of no more than 25 students, with teachers who know their names, their strengths and the things they still find hard. We teach boys from KG to Grade 6 and girls from KG to Grade 12. A KG child’s first week and a Grade 12 student’s university plans deserve the same care, and we give them both our full attention.

    We want our students to be at ease in an international setting and proud of who they are. That is why Arabic, the Holy Quran and Islamic Studies sit at the center of our timetable. Through our partnership with SPRIX in Japan, students in Grades 1 to 9 also study mathematics and programming using methods developed in Japanese schools.

    None of this works without parents. Our door is open, and we would always rather hear a concern early than late.

    I look forward to meeting you when you visit our campus.
  name: "Ms. Sara El-Massry"
  role: "Principal"

# A word from the Chief Academic Manager (shown under the Principal's welcome).
academicWord:
  title: "A Word from our Chief Academic Manager"
  body: |
    Every plan we make at Malvern starts with one question: what does the best learning in the world look like, and how do we make it work for children in Riyadh?

    We look carefully at what leading international schools do well, then shape it for our students and our community. That is why we teach an American curriculum through Savvas and Obelearn programmes, study mathematics and programming with SPRIX from Japan, and measure progress against outside benchmarks such as TOFAS. And it is why Arabic, the Holy Quran, Islamic Studies and Social Studies remain at the heart of every week.

    Good learning should be clear to parents, too. Our calendar sets out quizzes, revision weeks, semester exams and two parent–teacher conferences each year, so you always know how your child is doing and how to help.

    Our work is never finished. We keep reviewing, improving and asking how we can do better for every learner.
  name: "Mr. Mahmoud Nasr"
  role: "Chief Academic Manager"
  photo: "mahmoud-nasr.jpg"

