# Builds the website and publishes it to GitHub Pages (the gh-pages branch)
# every time a change is saved to the main branch or a claude/ preview branch.
name: Publish website

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg (for the hero video)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm ci

      - run: npm run build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publish website'
