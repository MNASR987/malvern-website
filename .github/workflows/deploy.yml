# Builds the website and publishes it to GitHub Pages (the gh-pages branch)
# every time a change is saved to the main branch or a claude/ preview branch.
name: Publish website

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to exact versions (commit IDs) so they cannot be changed under us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install ffmpeg (only when a hero video is uploaded)
        if: hashFiles('brand/hero-video.*') != ''
        timeout-minutes: 10
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - run: npm ci

      - run: npm run build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Publish website'
